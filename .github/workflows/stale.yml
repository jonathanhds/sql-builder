# This workflow warns and then closes issues and PRs that have had no activity for a specified amount of time.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/actions/stale
name: Mark stale issues and pull requests

on:
  schedule:
  - cron: '42 16 * * *'

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
    - uses: actions/stale@v5
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        stale-issue-message: 'Marking issue as stale due to inactivity'
        stale-pr-message: 'Marking PR as stale due to inactivity'
        close-issue-message: 'Closing issue due to inactivity'
        close-pr-message: 'Closing PR due to inactivity'
        stale-issue-label: 'Stale'
        stale-pr-label: 'Stale'
        delete-branch: true
